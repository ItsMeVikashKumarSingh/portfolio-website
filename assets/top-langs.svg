<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img" aria-label="Vikash Kumar Singh — Top Languages &amp; Core Stack">
  <defs>
    <linearGradient id="tl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15192e"/>
      <stop offset="100%" stop-color="#0e1224"/>
    </linearGradient>
    <linearGradient id="bar-java" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f89820"/>
      <stop offset="100%" stop-color="#e76f00"/>
    </linearGradient>
    <linearGradient id="bar-ts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3178c6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bar-py" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="bar-c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bar-rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect width="495" height="195" rx="14" fill="url(#tl-bg)" stroke="#1f2540" stroke-width="0.8"/>

  <!-- Header -->
  <g transform="translate(25, 30)">
    <circle cx="6" cy="6" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="10" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#f1f5f9" letter-spacing="1">MOST USED LANGUAGES &amp; STACK</text>
    <text x="445" y="10" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" letter-spacing="2">67 REPOS</text>
  </g>

  <line x1="25" y1="48" x2="470" y2="48" stroke="#1f2540" stroke-width="0.7"/>

  <!-- Composite Progress Bar -->
  <g transform="translate(25, 62)">
    <rect width="445" height="8" rx="4" fill="#0d111e"/>
    <!-- Java 30% = 133px -->
    <rect x="0" y="0" width="133" height="8" rx="4" fill="url(#bar-java)"/>
    <!-- TypeScript 24% = 107px -->
    <rect x="135" y="0" width="107" height="8" rx="2" fill="url(#bar-ts)"/>
    <!-- Python & AI 18% = 80px -->
    <rect x="244" y="0" width="80" height="8" rx="2" fill="url(#bar-py)"/>
    <!-- C / C++ 16% = 71px -->
    <rect x="326" y="0" width="71" height="8" rx="2" fill="url(#bar-c)"/>
    <!-- Rust 12% = 48px -->
    <rect x="399" y="0" width="46" height="8" rx="4" fill="url(#bar-rust)"/>
  </g>

  <!-- Language Grid -->
  <!-- Row 1 -->
  <g transform="translate(25, 102)" font-family="'Inter', system-ui, sans-serif" font-size="12">
    <!-- Java -->
    <circle cx="6" cy="6" r="4.5" fill="#f89820"/>
    <text x="18" y="10" font-weight="600" fill="#f1f5f9">Java</text>
    <text x="75" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">30.0%</text>

    <!-- TypeScript -->
    <circle cx="160" cy="6" r="4.5" fill="#3178c6"/>
    <text x="172" y="10" font-weight="600" fill="#f1f5f9">TypeScript</text>
    <text x="250" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">24.0%</text>

    <!-- Python -->
    <circle cx="330" cy="6" r="4.5" fill="#4ade80"/>
    <text x="342" y="10" font-weight="600" fill="#f1f5f9">Python / AI</text>
    <text x="420" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">18.0%</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(25, 142)" font-family="'Inter', system-ui, sans-serif" font-size="12">
    <!-- C / C++ -->
    <circle cx="6" cy="6" r="4.5" fill="#67e8f9"/>
    <text x="18" y="10" font-weight="600" fill="#f1f5f9">C / C++</text>
    <text x="75" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">16.0%</text>

    <!-- Rust -->
    <circle cx="160" cy="6" r="4.5" fill="#f43f5e"/>
    <text x="172" y="10" font-weight="600" fill="#f1f5f9">Rust</text>
    <text x="250" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">7.5%</text>

    <!-- JavaScript / Web -->
    <circle cx="330" cy="6" r="4.5" fill="#eab308"/>
    <text x="342" y="10" font-weight="600" fill="#f1f5f9">JavaScript</text>
    <text x="420" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">4.5%</text>
  </g>

  <!-- Footer note -->
  <text x="25" y="180" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569" letter-spacing="1">DISTRIBUTION COMPUTED ACROSS 67 PUBLIC REPOSITORIES</text>
</svg>